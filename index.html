<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مقدام — منصة الذكاء الاستباقي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html,body{height:100%;background:#0D0A54;color:rgba(255,255,255,.95);direction:rtl;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#5343B766;border-radius:2px}
.fi{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.spin{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .45s cubic-bezier(.17,.67,.3,1.4) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.sr{animation:sr .3s ease both}
@keyframes sr{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useRef,createElement:h,Fragment} = React;

// ── COLORS ──────────────────────────────────────────────
const C={
  navy:"#0D0A54",deep:"#281F89",purple:"#5343B7",soft:"#6F74D2",
  blue:"#84C9F3",lb:"#A4D5FE",pale:"#D9F1FF",
  yellow:"#D8EF23",white:"#FFFFFF",black:"#000000",
  card:"rgba(255,255,255,0.04)",border:"rgba(255,255,255,0.08)",
  tp:"rgba(255,255,255,0.95)",ts:"rgba(255,255,255,0.60)",tm:"rgba(255,255,255,0.38)",
  danger:"#FF4B4B",warn:"#FF8C00",ok:"#00C97A"
};

// ── HELPERS ─────────────────────────────────────────────
const s=(...args)=>Object.assign({},...args);
const el=(tag,props,...kids)=>h(tag,props,...kids);

// ── BADGE ───────────────────────────────────────────────
const Badge=({children,color=C.soft,style={}})=>h('span',{style:s({display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:4,fontSize:11,fontWeight:500,background:color+'22',border:`1px solid ${color}44`,color},style)},children);

// ── BUTTON ──────────────────────────────────────────────
const Btn=({children,variant='primary',onClick,style={},disabled=false,size='md'})=>{
  const sz={sm:{padding:'5px 12px',fontSize:11},md:{padding:'8px 18px',fontSize:13},lg:{padding:'11px 26px',fontSize:15}};
  const vr={
    primary:{background:C.yellow,color:C.navy,border:'none'},
    ghost:{background:'transparent',color:C.soft,border:`1px solid ${C.purple}55`},
    outline:{background:'transparent',color:C.tp,border:`1px solid ${C.border}`},
    danger:{background:C.danger+'22',color:C.danger,border:`1px solid ${C.danger}44`},
    success:{background:C.ok+'22',color:C.ok,border:`1px solid ${C.ok}44`},
  };
  return h('button',{onClick:disabled?undefined:onClick,style:s({display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,borderRadius:6,fontWeight:600,cursor:disabled?'not-allowed':'pointer',transition:'all .18s',opacity:disabled?.5:1},sz[size],vr[variant],style)},children);
};

// ── CARD ────────────────────────────────────────────────
const Card=({children,style={},onClick,glow=false})=>h('div',{onClick,style:s({background:C.card,border:`1px solid ${glow?C.yellow+'44':C.border}`,borderRadius:10,padding:16,transition:'border-color .2s',cursor:onClick?'pointer':undefined,boxShadow:glow?`0 0 20px ${C.yellow}18`:'none'},style)},children);

// ── RISK BADGE ──────────────────────────────────────────
const Risk=({level})=>{
  const m={"حرج":C.danger,"مرتفع":C.warn,"متوسط":C.yellow,"منخفض":C.ok};
  const bg=m[level]||C.soft;
  return h('span',{style:{background:bg+'22',color:bg,border:`1px solid ${bg}44`,fontSize:11,fontWeight:700,padding:'2px 9px',borderRadius:3}},level);
};

// ── STAT CARD ───────────────────────────────────────────
const StatCard=({value,unit,label,icon,highlight=false,color})=>{
  const clr=color||(highlight?C.yellow:C.tp);
  return h('div',{style:{background:C.card,border:`1px solid ${highlight?C.yellow+'44':C.border}`,borderRadius:8,padding:'14px 16px',display:'flex',flexDirection:'column',gap:4}},
    h('div',{style:{fontSize:10,color:C.tm}},icon),
    h('div',{style:{display:'flex',alignItems:'baseline',gap:4}},
      h('span',{style:{fontSize:28,fontWeight:800,color:clr,lineHeight:1}},value),
      unit&&h('span',{style:{fontSize:12,color:clr,fontWeight:500}},unit)
    ),
    h('div',{style:{fontSize:11,color:C.ts}},label)
  );
};

// ── AREA CHART SVG ──────────────────────────────────────
const AreaChart=()=>{
  const times=["15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00"];
  const prob=[10,18,32,55,78,85,62,30,12];
  const impact=[5,10,22,45,70,80,58,24,8];
  const W=420,H=180,PL=30,PR=10,PT=10,PB=30;
  const iW=W-PL-PR,iH=H-PT-PB;
  const xS=i=>PL+i*(iW/(times.length-1));
  const yS=v=>PT+iH-(v/100)*iH;
  const line=d=>d.map((v,i)=>`${i===0?'M':'L'}${xS(i)},${yS(v)}`).join(' ');
  const area=d=>`${line(d)} L${xS(d.length-1)},${PT+iH} L${xS(0)},${PT+iH} Z`;
  return h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:{display:'block'}},
    h('defs',null,
      h('linearGradient',{id:'g1',x1:'0',y1:'0',x2:'0',y2:'1'},h('stop',{offset:'0%',stopColor:C.soft,stopOpacity:'.5'}),h('stop',{offset:'100%',stopColor:C.soft,stopOpacity:'.02'})),
      h('linearGradient',{id:'g2',x1:'0',y1:'0',x2:'0',y2:'1'},h('stop',{offset:'0%',stopColor:C.yellow,stopOpacity:'.35'}),h('stop',{offset:'100%',stopColor:C.yellow,stopOpacity:'.02'}))
    ),
    [0,25,50,75,100].map(v=>h('line',{key:v,x1:PL,y1:yS(v),x2:W-PR,y2:yS(v),stroke:C.border,strokeWidth:'.5'})),
    times.map((t,i)=>h('text',{key:t,x:xS(i),y:H-4,textAnchor:'middle',fontSize:'8',fill:C.tm},t)),
    h('path',{d:area(prob),fill:'url(#g1)'}),
    h('path',{d:line(prob),fill:'none',stroke:C.soft,strokeWidth:'2',strokeLinecap:'round'}),
    h('path',{d:area(impact),fill:'url(#g2)'}),
    h('path',{d:line(impact),fill:'none',stroke:C.yellow,strokeWidth:'1.5',strokeLinecap:'round',strokeDasharray:'4 2'}),
    h('circle',{cx:PL+6,cy:H-18,r:'3',fill:C.soft}),
    h('text',{x:PL+14,y:H-15,fontSize:'8',fill:C.ts},'احتمالية التأثر'),
    h('circle',{cx:PL+90,cy:H-18,r:'3',fill:C.yellow}),
    h('text',{x:PL+98,y:H-15,fontSize:'8',fill:C.ts},'شدة الأثر')
  );
};

// ── ACCURACY CHART ──────────────────────────────────────
const AccChart=()=>{
  const bs=["حدث 1","حدث 2","حدث 3","حدث 4","حدث 5","حدث 6","حدث 7"];
  const loc=[75,80,83,85,86,88,90],conf=[70,76,79,82,85,87,91];
  const W=380,H=140,PL=28,PR=10,PT=10,PB=30;
  const iW=W-PL-PR,iH=H-PT-PB;
  const xS=i=>PL+i*(iW/(bs.length-1));
  const yS=v=>PT+iH-((v-65)/35)*iH;
  const line=d=>d.map((v,i)=>`${i===0?'M':'L'}${xS(i)},${yS(v)}`).join(' ');
  return h('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',style:{display:'block'}},
    [70,80,90,100].map(v=>h('g',{key:v},h('line',{x1:PL,y1:yS(v),x2:W-PR,y2:yS(v),stroke:C.border,strokeWidth:'.5'}),h('text',{x:PL-4,y:yS(v)+3,textAnchor:'end',fontSize:'7',fill:C.tm},v))),
    bs.map((b,i)=>h('text',{key:b,x:xS(i),y:H-4,textAnchor:'middle',fontSize:'7.5',fill:C.tm},b)),
    h('path',{d:line(loc),fill:'none',stroke:C.yellow,strokeWidth:'2',strokeLinecap:'round'}),
    loc.map((v,i)=>h('circle',{key:i,cx:xS(i),cy:yS(v),r:'3',fill:C.navy,stroke:C.yellow,strokeWidth:'1.5'})),
    h('path',{d:line(conf),fill:'none',stroke:C.soft,strokeWidth:'1.5',strokeLinecap:'round'}),
    conf.map((v,i)=>h('circle',{key:i,cx:xS(i),cy:yS(v),r:'2.5',fill:C.navy,stroke:C.soft,strokeWidth:'1.5'}))
  );
};

// ── NAV ─────────────────────────────────────────────────
const NAV=[
  {id:'dashboard',label:'مركز القيادة',icon:'⊞'},
  {id:'forecast',label:'التنبؤ بالأثر',icon:'◎'},
  {id:'map',label:'خريطة المخاطر',icon:'⊙'},
  {id:'priorities',label:'الأولويات',icon:'▣'},
  {id:'whatif',label:'محاكاة ماذا لو؟',icon:'⟆'},
  {id:'recommendations',label:'التوصيات',icon:'◈'},
  {id:'events',label:'الأحداث',icon:'⊛'},
  {id:'reports',label:'التقارير',icon:'⊡'},
  {id:'datasources',label:'مصادر البيانات',icon:'◉'},
  {id:'settings',label:'الإعدادات',icon:'⊟'},
];

// ── SIDEBAR ─────────────────────────────────────────────
const Sidebar=({active,onNav,approved})=>h('aside',{style:{width:210,background:`linear-gradient(180deg,${C.deep} 0%,${C.navy} 100%)`,borderLeft:`1px solid ${C.border}`,height:'100vh',display:'flex',flexDirection:'column',position:'fixed',right:0,top:0,zIndex:100}},
  h('div',{style:{padding:'18px 16px 14px',borderBottom:`1px solid ${C.border}`}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8}},
      h('div',{className:'pulse',style:{width:6,height:6,background:C.ok,borderRadius:'50%'}}),
      h('span',{style:{fontSize:17,fontWeight:800,color:C.white}},'مقدام')
    ),
    h('div',{style:{fontSize:10,color:C.tm,marginTop:3}},'الذكاء الاستباقي')
  ),
  h('nav',{style:{flex:1,overflowY:'auto',padding:'8px 0'}},
    NAV.map(item=>{
      const on=active===item.id;
      return h('button',{key:item.id,onClick:()=>onNav(item.id),style:{width:'100%',display:'flex',alignItems:'center',gap:9,padding:'9px 16px',background:on?`${C.purple}33`:'transparent',color:on?C.white:C.ts,fontSize:12.5,fontWeight:on?600:400,borderRight:on?`2px solid ${C.yellow}`:'2px solid transparent',textAlign:'right',direction:'rtl',cursor:'pointer',border:'none',transition:'all .15s',fontFamily:'Arial,sans-serif'}},
        h('span',{style:{fontSize:13,color:on?C.yellow:C.tm,flexShrink:0}},item.icon),
        h('span',{style:{flex:1}},item.label),
        item.id==='recommendations'&&approved&&h('span',{style:{fontSize:9,color:C.yellow}},'●'),
        item.id==='whatif'&&h('span',{style:{fontSize:9,background:C.yellow,color:C.navy,padding:'1px 5px',borderRadius:3,fontWeight:700}},'جديد')
      );
    })
  ),
  h('div',{style:{padding:'10px 14px',borderTop:`1px solid ${C.border}`}},
    h(Badge,{color:C.yellow,style:{color:C.navy,fontSize:10,fontWeight:700}},'◎ بيانات افتراضية')
  )
);

// ── TOPBAR ──────────────────────────────────────────────
const Topbar=({pageId,approved,onBack})=>{
  const titles={dashboard:'مركز القيادة',forecast:'التنبؤ بالأثر',map:'خريطة المخاطر',priorities:'الأولويات',whatif:'محاكاة ماذا لو؟',recommendations:'التوصيات',events:'الأحداث',reports:'التقارير',datasources:'مصادر البيانات',settings:'الإعدادات'};
  return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 22px',borderBottom:`1px solid ${C.border}`,background:`${C.navy}ee`,backdropFilter:'blur(8px)',position:'sticky',top:0,zIndex:50}},
    h('div',{style:{fontSize:15,fontWeight:700,color:C.white}},titles[pageId]||'مقدام'),
    h('div',{style:{display:'flex',gap:10,alignItems:'center'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:6,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'5px 12px'}},
        h('div',{className:'pulse',style:{width:6,height:6,background:C.ok,borderRadius:'50%'}}),
        h('span',{style:{fontSize:11,color:C.ok,fontWeight:600}},'النظام يعمل بشكل طبيعي')
      ),
      h(Badge,{color:C.soft,style:{fontSize:11}},'آخر تحديث: منذ 5 دقائق'),
      h(Badge,{color:C.yellow,style:{color:C.navy,fontWeight:700,fontSize:11}},'بيانات تجريبية'),
      approved&&h(Badge,{color:C.ok,style:{fontSize:11}},'✓ قرار معتمد'),
      h(Btn,{variant:'ghost',size:'sm',onClick:onBack},'← رجوع')
    )
  );
};

// ── LANDING ─────────────────────────────────────────────
const Landing=({onEnter,onDiscover})=>h('div',{style:{minHeight:'100vh',background:C.navy,display:'flex',flexDirection:'column',direction:'rtl',overflow:'auto'}},
  h('header',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'16px 40px',borderBottom:`1px solid ${C.border}`}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8}},
      h('div',{className:'pulse',style:{width:7,height:7,background:C.ok,borderRadius:'50%'}}),
      h('span',{style:{fontSize:20,fontWeight:800,color:C.white}},'مقدام'),
      h('span',{style:{fontSize:11,color:C.tm,marginRight:4}},'منصة الذكاء الاستباقي')
    ),
    h(Badge,{color:C.yellow,style:{color:C.navy,fontWeight:700}},'نموذج أولي تجريبي • بيانات افتراضية')
  ),
  h('section',{style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'60px 40px',textAlign:'center',position:'relative'}},
    h('div',{style:{position:'absolute',inset:0,background:`radial-gradient(ellipse 50% 40% at 50% 55%,${C.purple}28 0%,transparent 70%)`,pointerEvents:'none'}}),
    h('div',{style:{display:'inline-flex',alignItems:'center',gap:8,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'6px 14px',marginBottom:28}},
      h('div',{className:'pulse',style:{width:6,height:6,background:C.yellow,borderRadius:'50%'}}),
      h('span',{style:{fontSize:12,color:C.ts}},'حالة الاستخدام الأولى:'),
      h('span',{style:{fontSize:12,color:C.white,fontWeight:600}},'الأمطار والسيول — منطقة الحدود الشمالية')
    ),
    h('h1',{style:{fontSize:48,fontWeight:900,color:C.white,lineHeight:1.2,marginBottom:20,maxWidth:660}},
      'من التنبؤ بالحدث إلى ',h('span',{style:{color:C.yellow}},'التنبؤ بأثره.')
    ),
    h('p',{style:{fontSize:16,color:C.ts,lineHeight:1.85,maxWidth:580,marginBottom:36}},'منصة ذكاء استباقي تحوّل البيانات والمؤشرات المتعددة إلى رؤية قابلة للتنفيذ، وتساعد متخذ القرار على معرفة أين سيظهر الأثر، ومتى، ولماذا، وما الإجراء الأنسب قبل حدوثه.'),
    h('div',{style:{display:'flex',gap:12,justifyContent:'center'}},
      h(Btn,{variant:'primary',size:'lg',onClick:onEnter},'← الدخول إلى مركز القيادة'),
      h(Btn,{variant:'ghost',size:'lg',onClick:onDiscover},'استكشاف كيف يعمل مقدام')
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginTop:56,maxWidth:800,width:'100%'}},
      [{n:'01',t:'تنبأ',d:'حدد أين ومتى سيظهر الأثر قبل حدوثه.'},{n:'02',t:'حاكِ',d:'قارن أثر القرارات المختلفة قبل تنفيذها.'},{n:'03',t:'قرّر',d:'احصل على توصية استباقية قابلة للتفسير.',y:true}]
      .map((c,i)=>h('div',{key:i,style:{background:C.card,border:`1px solid ${c.y?C.yellow+'44':C.border}`,borderRadius:8,padding:'20px 18px',textAlign:'right'}},
        h('div',{style:{fontSize:10,color:c.y?C.yellow:C.tm,marginBottom:10,fontWeight:700}},c.n),
        h('div',{style:{fontSize:18,fontWeight:700,color:c.y?C.yellow:C.white,marginBottom:6}},c.t),
        h('div',{style:{fontSize:13,color:C.ts,lineHeight:1.6}},c.d)
      ))
    ),
    h('div',{style:{display:'flex',alignItems:'center',gap:0,marginTop:36,flexWrap:'wrap',justifyContent:'center'}},
      ['البيانات','التنبؤ بالأثر','تحديد الأولويات','محاكاة القرار','التوصية','القرار'].map((s,i,a)=>h('div',{key:i,style:{display:'flex',alignItems:'center'}},
        h('div',{style:{padding:'6px 14px',borderRadius:4,fontSize:12,fontWeight:500,background:s==='القرار'?C.yellow:C.card,border:`1px solid ${s==='القرار'?C.yellow:C.border}`,color:s==='القرار'?C.navy:C.ts}},s),
        i<a.length-1&&h('span',{style:{color:C.purple+'88',margin:'0 3px',fontSize:14}},'←')
      ))
    )
  ),
  h('footer',{style:{padding:'14px 40px',borderTop:`1px solid ${C.border}`,textAlign:'center'}},
    h('p',{style:{fontSize:11,color:C.tm}},'تستخدم النسخة الحالية بيانات افتراضية لأغراض المحاكاة والعرض، ويمكن ربط المنصة مستقبلًا بمصادر البيانات المصرح باستخدامها.')
  )
);

// ── HOW MODAL ───────────────────────────────────────────
const HowModal=({onClose})=>h('div',{onClick:onClose,style:{position:'fixed',inset:0,background:'#000a',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center'}},
  h('div',{className:'fi',onClick:e=>e.stopPropagation(),style:{background:C.deep,border:`1px solid ${C.border}`,borderRadius:12,padding:32,maxWidth:500,width:'90%',direction:'rtl'}},
    h('h3',{style:{fontSize:20,fontWeight:700,marginBottom:18,color:C.white}},'كيف يعمل مقدام؟'),
    [['البيانات الواردة','بيانات جوية + مكانية + تشغيلية + تاريخية'],['نموذج التنبؤ','يتنبأ بمواقع الأثر وزمنه ومستواه'],['محاكاة السيناريوهات','يقارن خيارات التدخل المختلفة قبل التنفيذ'],['التوصية القابلة للتفسير','يشرح لماذا أوصى بهذا القرار بالتحديد']].map(([t,d],i)=>
      h('div',{key:i,style:{display:'flex',gap:12,marginBottom:14}},
        h('div',{style:{width:26,height:26,background:C.yellow,color:C.navy,borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:12,flexShrink:0}},i+1),
        h('div',null,h('div',{style:{fontSize:13,fontWeight:600,color:C.white,marginBottom:3}},t),h('div',{style:{fontSize:12,color:C.ts}},d))
      )
    ),
    h(Btn,{variant:'primary',onClick:onClose,style:{marginTop:8,width:'100%'}},'دخول إلى المنصة')
  )
);

// ── DASHBOARD ───────────────────────────────────────────
const Dashboard=({onNav,approved})=>h('div',{className:'fi',style:{padding:'18px 22px',overflowY:'auto',height:'calc(100vh - 53px)'}},
  h('div',{style:{background:`linear-gradient(90deg,${C.purple}22,${C.card})`,border:`1px solid ${C.yellow}44`,borderRadius:10,borderRight:`3px solid ${C.yellow}`,padding:'14px 18px',marginBottom:18,display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16}},
    h('div',{style:{flex:1}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        h('div',{className:'pulse',style:{width:7,height:7,background:C.yellow,borderRadius:'50%'}}),
        h('span',{style:{fontSize:11,fontWeight:700,color:C.yellow,letterSpacing:.8}},'تنبيه استباقي')
      ),
      h('p',{style:{fontSize:15,color:C.white,lineHeight:1.65,maxWidth:520}},'يتوقع مقدام تأثر ',h('strong',{style:{color:C.yellow}},'8 مواقع'),' في منطقة عرعر خلال الساعات القادمة نتيجة الحالة المطرية المتوقعة.'),
      approved&&h('div',{style:{marginTop:8,fontSize:12,color:C.ok,fontWeight:600}},'✓ تم اعتماد التوصية — خطة الاستجابة محدّثة')
    ),
    h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:6}},
        [['مستوى الخطورة','مرتفع',true],['بداية الأثر المتوقع','16:30',true],['درجة الثقة','91%',false],['المواقع المتأثرة','8',false]].map(([l,v,y])=>
          h('div',{key:l,style:{minWidth:90}},
            h('div',{style:{fontSize:18,fontWeight:800,color:y?C.yellow:C.white}},v),
            h('div',{style:{fontSize:10,color:C.tm}},l)
          )
        )
      ),
      h('div',{style:{display:'flex',gap:8}},
        h(Btn,{variant:'primary',size:'sm',onClick:()=>onNav('whatif')},'محاكاة القرار'),

            h('div',null,h('span',{style:{fontSize:10,color:C.tm}},'السجلات: '),h('span',{style:{fontSize:12,color:C.white}},s.rec)),
            h('div',{style:{display:'flex',alignItems:'center',gap:7}},
              h('span',{style:{fontSize:10,color:C.tm}},'الجودة: '),
              h('div',{style:{width:56,height:4,background:C.border,borderRadius:2}},h('div',{style:{width:`${s.q}%`,height:'100%',background:C.soft,borderRadius:2}})),
              h('span',{style:{fontSize:11,color:C.soft,fontWeight:700}},s.q+'%')
            )
          ),
          h(Badge,{color:C.purple,style:{fontSize:10}},'بيانات افتراضية')
        )
      ))
    )
  );
};

// ── SETTINGS ────────────────────────────────────────────
const Settings=()=>{
  const [demo,setDemo]=useState(true);
  const [alerts,setAlerts]=useState(true);
  const Tog=({v,set})=>h('div',{onClick:()=>set(!v),style:{width:42,height:23,background:v?C.yellow:C.border,borderRadius:12,position:'relative',cursor:'pointer',transition:'all .2s'}},h('div',{style:{width:17,height:17,background:v?C.navy:C.tm,borderRadius:'50%',position:'absolute',top:3,right:v?3:'auto',left:v?'auto':3,transition:'all .2s'}}));
  return h('div',{className:'fi',style:{padding:'18px 22px',overflowY:'auto',height:'calc(100vh - 53px)'}},
    h('h2',{style:{fontSize:22,fontWeight:700,color:C.tp,marginBottom:20}},'الإعدادات'),
    [
      {title:'إعدادات العرض',items:[{label:'الوضع الداكن',sub:'واجهة داكنة للاستخدام في غرف العمليات',v:true,set:()=>{}}]},
      {title:'التنبيهات',items:[{label:'تنبيهات الخطورة العالية',sub:'إشعارات فورية عند ارتفاع المخاطر',v:alerts,set:setAlerts}]},
      {title:'مستويات المخاطر',items:[]},
      {title:'وضع العرض التجريبي',items:[{label:'تفعيل الوضع التجريبي',sub:'عرض البيانات الافتراضية للمحاكاة',v:demo,set:setDemo}]},
    ].map((sec,i)=>h(Card,{key:i,style:{padding:20,marginBottom:14}},
      h('div',{style:{fontSize:14,fontWeight:700,color:C.white,marginBottom:14}},sec.title),
      sec.items.length===0?h('div',{style:{display:'flex',gap:12,flexWrap:'wrap'}},['حرج','مرتفع','متوسط','منخفض'].map(l=>h(Risk,{key:l,level:l})),h('p',{style:{fontSize:11,color:C.tm,width:'100%',marginTop:8}},'مستويات المخاطر المعيارية — تُستخدم في التصنيف والتوصيات.')):
      sec.items.map((item,j)=>h('div',{key:j,style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',null,h('div',{style:{fontSize:13,color:C.white}},item.label),h('div',{style:{fontSize:11,color:C.tm,marginTop:3}},item.sub)),
        h(Tog,{v:item.v,set:item.set})
      ))
    )),
    h('div',{style:{padding:'12px 16px',background:C.yellow+'0d',borderRadius:8,border:`1px solid ${C.yellow}33`}},
      h('p',{style:{fontSize:11,color:C.tm,lineHeight:1.65}},'تستخدم النسخة الحالية بيانات افتراضية لأغراض المحاكاة والعرض، ويمكن ربط المنصة مستقبلًا بمصادر البيانات المصرح باستخدامها.')
    )
  );
};

// ── APP ─────────────────────────────────────────────────
function App(){
  const [view,setView]=useState('landing');
  const [page,setPage]=useState('dashboard');
  const [showHow,setShowHow]=useState(false);
  const [approved,setApproved]=useState(false);

  if(view==='landing')return h(Fragment,null,
    h(Landing,{onEnter:()=>setView('app'),onDiscover:()=>setShowHow(true)}),
    showHow&&h(HowModal,{onClose:()=>{setShowHow(false);setView('app');}})
  );

  const pages={
    dashboard:()=>h(Dashboard,{onNav:setPage,approved}),
    forecast:()=>h(Forecast),
    map:()=>h(MapPage,{onNav:setPage}),
    priorities:()=>h(Priorities,{onNav:setPage}),
    whatif:()=>h(WhatIf,{onApprove:()=>setApproved(true),approved}),
    recommendations:()=>h(Recommendations,{approved}),
    events:()=>h(Events),
    reports:()=>h(Reports),
    datasources:()=>h(DataSources),
    settings:()=>h(Settings),
  };

  const render=()=>{
    try{return (pages[page]||pages.dashboard)();}
    catch(e){return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'calc(100vh - 53px)',gap:14}},h('div',{style:{fontSize:15,color:C.ts}},'تعذر تحميل هذا الجزء'),h(Btn,{variant:'ghost',onClick:()=>setPage('dashboard')},'إعادة المحاولة'));}
  };

  return h('div',{style:{display:'flex',minHeight:'100vh',direction:'rtl'}},
    h(Sidebar,{active:page,onNav:setPage,approved}),
    h('main',{style:{marginRight:210,flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      h(Topbar,{pageId:page,approved,onBack:()=>setView('landing')}),
      render()
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
