<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مقدام — منصة الذكاء الاستباقي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: Arial, sans-serif !important; direction: rtl; }
  body { background: #0D0A54; color: rgba(255,255,255,0.95); -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { font-family: Arial, sans-serif !important; }
  ::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: #5343B766; border-radius: 2px; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ============================================================
// DESIGN TOKENS — Brand colors from image
// ============================================================
const C = {
  // Core brand palette (from color swatch image)
  navy:        "#0D0A54",   // darkest background
  deepPurple:  "#281F89",   // secondary bg
  purple:      "#5343B7",   // accent purple
  softPurple:  "#6F74D2",   // softer purple
  blue:        "#84C9F3",   // bright blue accent
  lightBlue:   "#A4D5FE",   // light blue
  paleBlue:    "#D9F1FF",   // pale blue
  yellow:      "#D8EF23",   // DECISION / ATTENTION — use sparingly
  white:       "#FFFFFF",
  black:       "#000000",
  // UI shades
  card:        "rgba(255,255,255,0.04)",
  cardBorder:  "rgba(255,255,255,0.08)",
  cardHover:   "rgba(255,255,255,0.07)",
  textPrimary: "rgba(255,255,255,0.95)",
  textSub:     "rgba(255,255,255,0.60)",
  textMuted:   "rgba(255,255,255,0.38)",
  // Semantic
  danger:      "#FF4B4B",
  warning:     "#FF8C00",
  success:     "#00C97A",
  // Chart colors
  chart1:      "#5343B7",
  chart2:      "#D8EF23",
  chart3:      "#84C9F3",
  chart4:      "#FF8C00",
};

const F = `Arial, sans-serif`;

// ============================================================
// GLOBAL STYLES
// ============================================================
const GS = () => (
  <style>{`
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: ${C.navy};
      color: ${C.textPrimary};
      font-family: ${F};
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: ${C.purple}66; border-radius: 2px; }
    button, select, input { font-family: ${F}; }
    button { cursor: pointer; border: none; background: none; }
    .fi { animation: fi .35s ease both; }
    @keyframes fi { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.5)} }
    .spin { animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pop { animation: pop .45s cubic-bezier(.17,.67,.3,1.4) both; }
    @keyframes pop { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }
    .sr { animation: sr .3s ease both; }
    @keyframes sr { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:translateX(0)} }
    /* line chart animations */
    .chart-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 1.4s ease forwards; }
    @keyframes dash { to { stroke-dashoffset: 0; } }
  `}</style>
);

// ============================================================
// MICRO COMPONENTS
// ============================================================

// Top-level badge
const Badge = ({ children, color = C.softPurple, bg, style = {} }) => (
  <span style={{
    display:"inline-flex", alignItems:"center", gap:5,
    padding:"3px 10px", borderRadius:4, fontSize:11, fontWeight:500,
    background: bg || color+"22",
    border:`1px solid ${color}44`,
    color,
    ...style
  }}>{children}</span>
);

// Button
const Btn = ({ children, variant="primary", onClick, style={}, disabled=false, size="md" }) => {
  const sizes = { sm:{ padding:"5px 12px", fontSize:11 }, md:{ padding:"8px 18px", fontSize:13 }, lg:{ padding:"11px 26px", fontSize:15 } };
  const variants = {
    primary:  { background:C.yellow, color:C.navy, border:"none" },
    accent:   { background:C.purple, color:C.white, border:"none" },
    ghost:    { background:"transparent", color:C.softPurple, border:`1px solid ${C.purple}55` },
    outline:  { background:"transparent", color:C.textPrimary, border:`1px solid ${C.cardBorder}` },
    danger:   { background:C.danger+"22", color:C.danger, border:`1px solid ${C.danger}44` },
    success:  { background:C.success+"22", color:C.success, border:`1px solid ${C.success}44` },
  };
  return (
    <button
      onClick={disabled ? undefined : onClick}
      style={{
        display:"inline-flex", alignItems:"center", justifyContent:"center", gap:6,
        borderRadius:6, fontWeight:600, fontFamily:F, cursor:disabled?"not-allowed":"pointer",
        transition:"all .18s", opacity:disabled?.5:1,
        ...sizes[size], ...variants[variant], ...style
      }}
    >{children}</button>
  );
};

// Card container
const Card = ({ children, style={}, onClick, glow=false }) => (
  <div
    onClick={onClick}
    style={{
      background: C.card,
      border:`1px solid ${glow ? C.yellow+"44" : C.cardBorder}`,
      borderRadius:10,
      padding:16,
      transition:"border-color .2s",
      cursor: onClick?"pointer":undefined,
      boxShadow: glow ? `0 0 20px ${C.yellow}18` : "none",
      ...style
    }}
  >{children}</div>
);

// Section heading
const SH = ({ title, sub, light=false, style={} }) => (
  <div style={{ marginBottom:20, ...style }}>
    <h2 style={{ fontSize:22, fontWeight:700, color:light?C.navy:C.textPrimary, lineHeight:1.3 }}>{title}</h2>
    {sub && <p style={{ fontSize:12, color:light?C.softPurple:C.textSub, marginTop:4, lineHeight:1.6 }}>{sub}</p>}
  </div>
);

// Risk level badge
const Risk = ({ level }) => {
  const m = { "حرج":[C.danger,"#FF1A1A"], "مرتفع":[C.warning,"#FF6B00"], "متوسط":[C.yellow,C.navy], "منخفض":[C.success,"#00FF99"] };
  const [bg, tx] = m[level]||[C.softPurple,C.white];
  return <span style={{ background:bg+"22", color:bg, border:`1px solid ${bg}44`, fontSize:11, fontWeight:700, padding:"2px 9px", borderRadius:3 }}>{level}</span>;
};

// Stat card — matching the dashboard screenshot layout
const StatCard = ({ value, unit, label, icon, highlight=false, color }) => {
  const clr = color || (highlight ? C.yellow : C.textPrimary);
  return (
    <div style={{
      background: C.card,
      border:`1px solid ${highlight ? C.yellow+"44" : C.cardBorder}`,
      borderRadius:8, padding:"14px 16px",
      display:"flex", flexDirection:"column", gap:4,
    }}>
      <div style={{ fontSize:10, color:C.textMuted, textTransform:"uppercase", letterSpacing:.5 }}>{icon}</div>
      <div style={{ display:"flex", alignItems:"baseline", gap:4 }}>
        <span style={{ fontSize:28, fontWeight:800, color:clr, lineHeight:1 }}>{value}</span>
        {unit && <span style={{ fontSize:12, color:clr, fontWeight:500 }}>{unit}</span>}
      </div>
      <div style={{ fontSize:11, color:C.textSub }}>{label}</div>
    </div>
  );
};

// ============================================================
// INLINE MINI LINE CHART (SVG based, no library)
// ============================================================
const MiniLineChart = ({ data, color=C.softPurple, height=40 }) => {
  const w = 120;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v,i) => `${(i/(data.length-1))*w},${height-(((v-min)/range)*height*.85+height*.05)}`).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" style={{display:"block"}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

// ============================================================
// AREA CHART (forecast page)
// ============================================================
const AreaChart = ({ width=420, height=220 }) => {
  const times = ["15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00"];
  const prob  = [10,18,32,55,78,85,62,30,12];
  const impact= [5,10,22,45,70,80,58,24,8];
  const W=420, H=180, PAD={t:10,r:10,b:30,l:30};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;
  const xS=(i)=>PAD.l+i*(iW/(times.length-1));
  const yS=(v)=>PAD.t+iH-(v/100)*iH;
  const line=(data)=>data.map((v,i)=>`${i===0?"M":"L"}${xS(i)},${yS(v)}`).join(" ");
  const area=(data)=>`${line(data)} L${xS(data.length-1)},${PAD.t+iH} L${xS(0)},${PAD.t+iH} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.softPurple} stopOpacity=".5"/>
          <stop offset="100%" stopColor={C.softPurple} stopOpacity=".02"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.yellow} stopOpacity=".35"/>
          <stop offset="100%" stopColor={C.yellow} stopOpacity=".02"/>
        </linearGradient>
      </defs>
      {[0,25,50,75,100].map(v=>(
        <line key={v} x1={PAD.l} y1={yS(v)} x2={W-PAD.r} y2={yS(v)} stroke={C.cardBorder} strokeWidth=".5"/>
      ))}
      {times.map((t,i)=>(
        <text key={t} x={xS(i)} y={H-4} textAnchor="middle" fontSize="8" fill={C.textMuted} fontFamily={F}>{t}</text>
      ))}
      <path d={area(prob)} fill="url(#g1)" />
      <path d={line(prob)} fill="none" stroke={C.softPurple} strokeWidth="2" strokeLinecap="round"/>
      <path d={area(impact)} fill="url(#g2)" />
      <path d={line(impact)} fill="none" stroke={C.yellow} strokeWidth="1.5" strokeLinecap="round" strokeDasharray="4 2"/>
      {/* Legend */}
      <circle cx={PAD.l+6} cy={H-18} r="3" fill={C.softPurple}/>
      <text x={PAD.l+14} y={H-15} fontSize="8" fill={C.textSub} fontFamily={F}>احتمالية التأثر</text>
      <circle cx={PAD.l+90} cy={H-18} r="3" fill={C.yellow}/>
      <text x={PAD.l+98} y={H-15} fontSize="8" fill={C.textSub} fontFamily={F}>شدة الأثر</text>
    </svg>
  );
};

// Accuracy chart
const AccuracyChart = ({ height=160 }) => {
  const batches = ["حدث 1","حدث 2","حدث 3","حدث 4","حدث 5","حدث 6","حدث 7"];
  const loc  = [75,80,83,85,86,88,90];
  const conf = [70,76,79,82,85,87,91];
  const W=380,H=140,PAD={t:10,r:10,b:30,l:28};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;
  const xS=(i)=>PAD.l+i*(iW/(batches.length-1));
  const yS=(v)=>PAD.t+iH-((v-65)/35)*iH;
  const line=(data)=>data.map((v,i)=>`${i===0?"M":"L"}${xS(i)},${yS(v)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
      {[70,80,90,100].map(v=>(
        <g key={v}>
          <line x1={PAD.l} y1={yS(v)} x2={W-PAD.r} y2={yS(v)} stroke={C.cardBorder} strokeWidth=".5"/>
          <text x={PAD.l-4} y={yS(v)+3} textAnchor="end" fontSize="7" fill={C.textMuted} fontFamily={F}>{v}</text>
        </g>
      ))}
      {batches.map((b,i)=>(
        <text key={b} x={xS(i)} y={H-4} textAnchor="middle" fontSize="7.5" fill={C.textMuted} fontFamily={F}>{b}</text>
      ))}
      <path d={line(loc)} fill="none" stroke={C.yellow} strokeWidth="2" strokeLinecap="round"/>
      {loc.map((v,i)=><circle key={i} cx={xS(i)} cy={yS(v)} r="3" fill={C.navy} stroke={C.yellow} strokeWidth="1.5"/>)}
      <path d={line(conf)} fill="none" stroke={C.softPurple} strokeWidth="1.5" strokeLinecap="round"/>
      {conf.map((v,i)=><circle key={i} cx={xS(i)} cy={yS(v)} r="2.5" fill={C.navy} stroke={C.softPurple} strokeWidth="1.5"/>)}
    </svg>
  );
};

// ============================================================
// LANDING PAGE
// ============================================================
const Landing = ({ onEnter, onDiscover }) => (
  <div style={{ minHeight:"100vh", background:C.navy, display:"flex", flexDirection:"column", direction:"rtl", overflow:"auto" }}>
    {/* Header */}
    <header style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"16px 40px", borderBottom:`1px solid ${C.cardBorder}` }}>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <div style={{ width:7, height:7, background:C.success, borderRadius:"50%" }} className="pulse"/>
        <span style={{ fontSize:20, fontWeight:800, color:C.white }}>مقدام</span>
        <span style={{ fontSize:11, color:C.textMuted, marginRight:4 }}>منصة الذكاء الاستباقي</span>
      </div>
      <Badge color={C.yellow} style={{ color:C.navy, fontWeight:700 }}>نموذج أولي تجريبي • بيانات افتراضية</Badge>
    </header>

    {/* Hero */}
    <section style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"60px 40px", textAlign:"center", position:"relative" }}>
      {/* Glow */}
      <div style={{ position:"absolute", inset:0, background:`radial-gradient(ellipse 50% 40% at 50% 55%, ${C.purple}28 0%, transparent 70%)`, pointerEvents:"none" }}/>

      {/* Badge */}
      <div style={{ display:"inline-flex", alignItems:"center", gap:8, background:C.card, border:`1px solid ${C.cardBorder}`, borderRadius:6, padding:"6px 14px", marginBottom:28 }}>
        <div style={{ width:6, height:6, background:C.yellow, borderRadius:"50%" }} className="pulse"/>
        <span style={{ fontSize:12, color:C.textSub }}>حالة الاستخدام الأولى:</span>
        <span style={{ fontSize:12, color:C.white, fontWeight:600 }}>الأمطار والسيول — منطقة الحدود الشمالية</span>
      </div>

      {/* Main title */}
      <h1 style={{ fontSize:48, fontWeight:900, color:C.white, lineHeight:1.2, marginBottom:20, maxWidth:660 }}>
        من التنبؤ بالحدث إلى{" "}
        <span style={{ color:C.yellow }}>التنبؤ بأثره.</span>
      </h1>
      <p style={{ fontSize:16, color:C.textSub, lineHeight:1.85, maxWidth:580, marginBottom:36 }}>
        منصة ذكاء استباقي تحوّل البيانات والمؤشرات المتعددة إلى رؤية قابلة للتنفيذ، وتساعد متخذ القرار على معرفة أين سيظهر الأثر، ومتى، ولماذا، وما الإجراء الأنسب قبل حدوثه.
      </p>
      <div style={{ display:"flex", gap:12, justifyContent:"center" }}>
        <Btn variant="primary" size="lg" onClick={onEnter}>← الدخول إلى مركز القيادة</Btn>
        <Btn variant="ghost" size="lg" onClick={onDiscover}>استكشاف كيف يعمل مقدام</Btn>
      </div>

      {/* Three capabilities */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:16, marginTop:56, maxWidth:800, width:"100%" }}>
        {[
          { n:"01", t:"تنبأ", d:"حدد أين ومتى سيظهر الأثر قبل حدوثه." },
          { n:"02", t:"حاكِ", d:"قارن أثر القرارات المختلفة قبل تنفيذها." },
          { n:"03", t:"قرّر", d:"احصل على توصية استباقية قابلة للتفسير.", y:true },
        ].map((c,i)=>(
          <div key={i} style={{ background:C.card, border:`1px solid ${c.y?C.yellow+"44":C.cardBorder}`, borderRadius:8, padding:"20px 18px", textAlign:"right" }}>
            <div style={{ fontSize:10, color:c.y?C.yellow:C.textMuted, marginBottom:10, fontWeight:700 }}>{c.n}</div>
            <div style={{ fontSize:18, fontWeight:700, color:c.y?C.yellow:C.white, marginBottom:6 }}>{c.t}</div>
            <div style={{ fontSize:13, color:C.textSub, lineHeight:1.6 }}>{c.d}</div>
          </div>
        ))}
      </div>

      {/* Flow */}
      <div style={{ display:"flex", alignItems:"center", gap:0, marginTop:36, flexWrap:"wrap", justifyContent:"center" }}>
        {["البيانات","التنبؤ بالأثر","تحديد الأولويات","محاكاة القرار","التوصية","القرار"].map((s,i,a)=>(
          <div key={i} style={{ display:"flex", alignItems:"center" }}>
            <div style={{
              padding:"6px 14px", borderRadius:4, fontSize:12, fontWeight:500,
              background: s==="القرار"?C.yellow:C.card,
              border:`1px solid ${s==="القرار"?C.yellow:C.cardBorder}`,
              color: s==="القرار"?C.navy:C.textSub
            }}>{s}</div>
            {i<a.length-1 && <span style={{ color:C.purple+"88", margin:"0 3px", fontSize:14 }}>←</span>}
          </div>
        ))}
      </div>
    </section>
    <footer style={{ padding:"14px 40px", borderTop:`1px solid ${C.cardBorder}`, textAlign:"center" }}>
      <p style={{ fontSize:11, color:C.textMuted }}>تستخدم النسخة الحالية بيانات افتراضية لأغراض المحاكاة والعرض، ويمكن ربط المنصة مستقبلًا بمصادر البيانات المصرح باستخدامها.</p>
    </footer>
  </div>
);

// How it works modal
const HowModal = ({ onClose }) => (
  <div style={{ position:"fixed",inset:0,background:"#000a",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center" }} onClick={onClose}>
    <div className="fi" onClick={e=>e.stopPropagation()} style={{ background:C.deepPurple,border:`1px solid ${C.cardBorder}`,borderRadius:12,padding:32,maxWidth:500,width:"90%",direction:"rtl" }}>
      <h3 style={{ fontSize:20,fontWeight:700,marginBottom:18,color:C.white }}>كيف يعمل مقدام؟</h3>
      {[["البيانات الواردة","بيانات جوية + مكانية + تشغيلية + تاريخية"],["نموذج التنبؤ","يتنبأ بمواقع الأثر وزمنه ومستواه"],["محاكاة السيناريوهات","يقارن خيارات التدخل المختلفة قبل التنفيذ"],["التوصية القابلة للتفسير","يشرح لماذا أوصى بهذا القرار بالتحديد"]].map(([t,d],i)=>(
        <div key={i} style={{ display:"flex",gap:12,marginBottom:14 }}>
          <div style={{ width:26,height:26,background:C.yellow,color:C.navy,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:12,flexShrink:0 }}>{i+1}</div>
          <div><div style={{ fontSize:13,fontWeight:600,color:C.white,marginBottom:3 }}>{t}</div><div style={{ fontSize:12,color:C.textSub }}>{d}</div></div>
        </div>
      ))}
      <Btn variant="primary" onClick={onClose} style={{ marginTop:8,width:"100%" }}>دخول إلى المنصة</Btn>
    </div>
  </div>
);

// ============================================================
// SIDEBAR
// ============================================================
const NAV = [
  { id:"dashboard",       label:"مركز القيادة",    icon:"⊞" },
  { id:"forecast",        label:"التنبؤ بالأثر",   icon:"◎" },
  { id:"map",             label:"خريطة المخاطر",   icon:"⊙" },
  { id:"priorities",      label:"الأولويات",        icon:"▣" },
  { id:"whatif",          label:"محاكاة ماذا لو؟", icon:"⟆" },
  { id:"recommendations", label:"التوصيات",         icon:"◈" },
  { id:"events",          label:"الأحداث",          icon:"⊛" },
  { id:"reports",         label:"التقارير",         icon:"⊡" },
  { id:"datasources",     label:"مصادر البيانات",   icon:"◉" },
  { id:"settings",        label:"الإعدادات",        icon:"⊟" },
];

const Sidebar = ({ active, onNav, approved }) => (
  <aside style={{
    width:210, background:`linear-gradient(180deg, ${C.deepPurple} 0%, ${C.navy} 100%)`,
    borderLeft:`1px solid ${C.cardBorder}`,
    height:"100vh", display:"flex", flexDirection:"column",
    position:"fixed", right:0, top:0, zIndex:100
  }}>
    {/* Logo */}
    <div style={{ padding:"18px 16px 14px", borderBottom:`1px solid ${C.cardBorder}` }}>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <div style={{ width:6, height:6, background:C.success, borderRadius:"50%" }} className="pulse"/>
        <span style={{ fontSize:17, fontWeight:800, color:C.white }}>مقدام</span>
      </div>
      <div style={{ fontSize:10, color:C.textMuted, marginTop:3 }}>الذكاء الاستباقي</div>
    </div>
    {/* Nav */}
    <nav style={{ flex:1, overflowY:"auto", padding:"8px 0" }}>
      {NAV.map(item => {
        const on = active===item.id;
        return (
          <button key={item.id} onClick={()=>onNav(item.id)} style={{
            width:"100%", display:"flex", alignItems:"center", gap:9,
            padding:"9px 16px",
            background: on?`${C.purple}33`:"transparent",
            color: on?C.white:C.textSub,
            fontSize:12.5, fontWeight:on?600:400,
            borderRight: on?`2px solid ${C.yellow}`:"2px solid transparent",
            textAlign:"right", direction:"rtl", fontFamily:F,
            transition:"all .15s",
          }}>

// ============================================================
// MAIN APP
// ============================================================
function App() {
  const [view, setView] = useState("landing");
  const [page, setPage] = useState("dashboard");
  const [showHow, setShowHow] = useState(false);
  const [approved, setApproved] = useState(false);

  if(view==="landing") return (
    <>
      <GS/>
      <Landing onEnter={()=>setView("app")} onDiscover={()=>setShowHow(true)}/>
      {showHow && <HowModal onClose={()=>{ setShowHow(false); setView("app"); }}/>}
    </>
  );

  const renderPage = () => {
    try {
      switch(page) {
        case "dashboard":       return <Dashboard    onNav={setPage} approved={approved}/>;
        case "forecast":        return <Forecast/>;
        case "map":             return <MapPage       onNav={setPage}/>;
        case "priorities":      return <Priorities   onNav={setPage}/>;
        case "whatif":          return <WhatIf       onApprove={()=>setApproved(true)} approved={approved}/>;
        case "recommendations": return <Recommendations approved={approved}/>;
        case "events":          return <Events/>;
        case "reports":         return <Reports/>;
        case "datasources":     return <DataSources/>;
        case "settings":        return <Settings/>;
        default: return (
          <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"calc(100vh - 53px)",gap:14 }}>
            <div style={{ fontSize:28, color:C.purple }}>◎</div>
            <div style={{ fontSize:15, color:C.textSub }}>تعذر تحميل هذا الجزء</div>
            <Btn variant="ghost" onClick={()=>setPage("dashboard")}>إعادة المحاولة</Btn>
          </div>
        );
      }
    } catch(e) {
      return (
        <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"calc(100vh - 53px)",gap:14 }}>
          <div style={{ fontSize:15, color:C.textSub }}>تعذر تحميل هذا الجزء</div>
          <Btn variant="ghost" onClick={()=>setPage("dashboard")}>إعادة المحاولة</Btn>
        </div>
      );
    }
  };

  return (
    <>
      <GS/>
      <div style={{ display:"flex", minHeight:"100vh", direction:"rtl" }}>
        <Sidebar active={page} onNav={setPage} approved={approved}/>
        <main style={{ marginRight:210, flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
          <Topbar pageId={page} approved={approved} onBack={()=>setView("landing")}/>
          {renderPage()}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
